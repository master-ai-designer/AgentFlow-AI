name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/agentflow-npm-audit.json || true
          node -e 'const a=require("/tmp/agentflow-npm-audit.json"); console.log(JSON.stringify({vulnerabilities:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via||[]).filter(x=>typeof x!=="string").map(x=>({title:x.title,url:x.url,range:x.range}))}))},null,2))'
      - name: Build production app
        run: npm run build
      - name: Smoke-test production server and API routes
        run: node scripts/smoke-test.mjs
